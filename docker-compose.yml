# Container logs (docker json-file driver) are rotated so they can't fill the disk.
# Tune in .env: LOG_MAX_SIZE / LOG_MAX_FILE.
x-logging: &default-logging
    driver: json-file
    options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"

services:
    proxy-nginx-proxy:
        container_name: proxy-nginx-proxy
        logging: *default-logging
        image: nginxproxy/nginx-proxy:${NGINX_PROXY_VERSION:-1.7}
        restart: unless-stopped
        environment:
            ENABLE_IPV6: "true"
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./conf:/etc/nginx/conf.d
            - ./vhost:/etc/nginx/vhost.d
            - ./html:/usr/share/nginx/html
            - ./dhparam:/etc/nginx/dhparam
            - ./certs:/etc/nginx/certs:ro
            - /var/run/docker.sock:/tmp/docker.sock:ro
            - ./htpasswd:/etc/nginx/htpasswd:ro #Remove for local env

    proxy-acme-companion:
        container_name: proxy-acme-companion
        logging: *default-logging
        image: nginxproxy/acme-companion:${ACME_COMPANION_VERSION:-latest}
        restart: unless-stopped
        depends_on:
            - proxy-nginx-proxy
        volumes:
            - ./vhost:/etc/nginx/vhost.d
            - ./html:/usr/share/nginx/html
            - ./dhparam:/etc/nginx/dhparam
            - ./certs:/etc/nginx/certs:rw
            - /var/run/docker.sock:/var/run/docker.sock:ro
        environment:
            NGINX_PROXY_CONTAINER: proxy-nginx-proxy
            FILES_UID: ${USER_ID}
            FILES_GID: ${GROUP_ID}
            FILES_PERMS: 644
        profiles:
            - acme

    proxy-self-signed-companion:
        container_name: proxy-self-signed-companion
        logging: *default-logging
        image: sebastienheyd/self-signed-proxy-companion:${SELF_SIGNED_VERSION:-latest}
        restart: unless-stopped
        depends_on:
            - proxy-nginx-proxy
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - ./certs:/etc/nginx/certs:rw
        environment:
            NGINX_PROXY_CONTAINER: proxy-nginx-proxy
        profiles:
            - self-signed

    # Mailpit catches every email sent by the projects (SMTP mailcatcher:1025),
    # web UI on ${MAILCATCHER}. The "mailcatcher" alias keeps the projects' msmtp
    # / SMTP settings working unchanged.
    mailpit:
        container_name: mailpit
        logging: *default-logging
        image: axllent/mailpit:${MAILPIT_VERSION:-v1.31.6}
        restart: unless-stopped
        environment:
            MP_DATABASE: /data/mailpit.db
            MP_MAX_MESSAGES: 5000
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1
            VIRTUAL_HOST: ${MAILCATCHER}
            VIRTUAL_PORT: "8025"
            SELF_SIGNED_HOST: ${MAILCATCHER}
            LETSENCRYPT_HOST: ${MAILCATCHER}
            LETSENCRYPT_EMAIL: "admin@${MAILCATCHER}"
        volumes:
            - mailpitdata:/data
        healthcheck:
            test: ["CMD", "/mailpit", "readyz"]
            interval: 30s
            timeout: 5s
            retries: 3
        networks:
            default:
            mail-catcher-network:
                aliases:
                    - mailcatcher
        depends_on:
            - proxy-nginx-proxy

    opensearch:
        container_name: opensearch
        logging: *default-logging
        # Tagged with the version: changing OPENSEARCH_VERSION builds a new image on the next start
        image: nginx-proxy-opensearch:${OPENSEARCH_VERSION:-3.9.0}
        build:
            dockerfile: Dockerfile
            context: images/opensearch
            args:
                OPENSEARCH_VERSION: ${OPENSEARCH_VERSION:-3.9.0}
        restart: unless-stopped
        env_file: env/opensearch.env
        environment:
            - "discovery.type=single-node"
            - "cluster.routing.allocation.disk.threshold_enabled=false"
            - "index.blocks.read_only_allow_delete"
            - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"
            - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=magento"
        volumes:
            - opensearchdata:/usr/share/opensearch/data
        healthcheck:
            test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9200/_cluster/health >/dev/null || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 90s
        networks:
            - open-search-network

    phpmyadmin:
        container_name: phpmyadmin
        logging: *default-logging
        image: linuxserver/phpmyadmin:${PHPMYADMIN_VERSION:-latest}
        restart: unless-stopped
        env_file: env/phpmyadmin.env
        environment:
            VIRTUAL_HOST: ${PHPMYADMIN}
            VIRTUAL_PORT: "80"
            SELF_SIGNED_HOST: ${PHPMYADMIN}
            LETSENCRYPT_HOST: ${PHPMYADMIN}
            LETSENCRYPT_EMAIL: "admin@${PHPMYADMIN}"
        depends_on:
            - proxy-nginx-proxy
        networks:
            - default
            - shared-db-network

    rabbitmq:
        container_name: rabbitmq
        logging: *default-logging
        image: rabbitmq:${RABBITMQ_VERSION:-4.1}-management-alpine
        restart: unless-stopped
        environment:
            RABBITMQ_DEFAULT_USER: "admin"
            RABBITMQ_DEFAULT_PASS: "rabbitmq"
            RABBITMQ_DEFAULT_VHOST: "/"
            VIRTUAL_HOST: ${RABBITMQ}
            VIRTUAL_PORT: "15672"
            VIRTUAL_PROTO: "http"
            RABBITMQ_MANAGEMENT_PORT: "15672"
            SELF_SIGNED_HOST: ${RABBITMQ}
            LETSENCRYPT_HOST: ${RABBITMQ}
            LETSENCRYPT_EMAIL: "admin@${RABBITMQ}"
        ports:
            - "5672:5672"
        volumes:
            - rabbitmqdata:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s
        depends_on:
            - proxy-nginx-proxy
        networks:
            - default
            - rabbitmq-network

volumes:
    mailpitdata:
    opensearchdata:
    rabbitmqdata:

networks:
    default:
        external: true
        name: nginx-proxy
    shared-db-network:
        external: true
    mail-catcher-network:
        external: true
    open-search-network:
        external: true
    rabbitmq-network:
        external: true
